services:
  postgres:
    image: postgres:16-alpine
    container_name: calculadora-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-calculadora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-calculadora}
      POSTGRES_DB: ${DB_NAME:-calculadora}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - calculadora-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-calculadora} -d ${DB_NAME:-calculadora}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  calculadora-pgdata:
